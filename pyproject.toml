[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-operator"
version = "0.1.0"
description = "Local-first routing layer that selects among a user's OpenAI-compatible models per conversation turn"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Indigo Karasu" }]
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hello-operator = "hello_operator.__main__:main"

[tool.setuptools.packages.find]
include = ["hello_operator*"]
