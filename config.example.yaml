# HelloOperator — example configuration
#
# This file is the whole configuration surface (FR-14): one file, no database.
# Every model field resolves declared > detected > default, and the router
# shows the provenance of each value at startup and in `--check`.
#
# The degenerate configuration is first-class: with exactly one model you can
# delete `roles:` and `routing:` entirely and the router behaves like a direct
# connection (NFR-7). Routing is something a config grows into.

router:
  listen: 127.0.0.1:8800          # loopback by default (FR-12); binding anything
  # allow_non_loopback: true      # else requires this explicit opt-in
  logical_model: hello-operator    # the one model name clients target (FR-1)
  session_header: x-session-id    # caller-supplied session identity (FR-5)
  compaction_header: x-context-compacted   # documented convention, not a hard dependency
  pin_header: x-router-pin        # manual override for debugging (FR-13)
  affinity_idle_timeout_s: 3600
  switch_cost: low                # low | high — high raises transition thresholds (FR-6)
  hop_limit: 1                    # max escalation hops per session (FR-7)
  classify_margin: 0.08           # classifier disagreement needed to switch roles
  max_inflight: 0                 # >0 caps concurrent backend requests (NFR-5)
  shutdown_drain_s: 5             # on stop, in-flight turns get this long to finish,
                                  # then are cut so the process exits well inside
                                  # systemd's 90 s stop timeout
  repeat_call_threshold: 3        # identical call repeated this often => escalate
  decision_log: ""                # path to a JSONL decision log; empty disables (FR-11)
  state_dir: ~/.hello-operator
  # refusal_markers: []           # advisory string match, off by default (FR-7 MAY)
  # refusal_escalate: false

# ------------------------------------------------------------------ registry
# Each model the user runs is declared once (spec 3.1). `capabilities`,
# `context_window`, `residency`, and `speed_class` may be omitted — detection
# fills what the backend exposes, heuristic defaults fill the rest, and your
# declarations always win.
models:
  main-model:
    id: qwen3-235b-a22b
    endpoint: http://127.0.0.1:8080/v1        # llama.cpp / Ollama / LM Studio / vLLM / MLX
    capabilities: [text, vision, tools, json, reasoning-effort]
    context_window: 131072
    residency: resident
    speed_class: slow
  qwen-fast:
    id: qwen3-30b-a3b
    endpoint: http://127.0.0.1:8081/v1
    capabilities: [text, tools, json]
    context_window: 32768
    residency: resident
    speed_class: fast
    # probe: true                 # probes default off for on-demand models (3.1a)
    # api_key: ${SOME_TOKEN}      # for backends that want a bearer token

  # A hosted model is just another registry entry. Its traffic leaves the
  # machine, so the router refuses to start until you also set
  # router.allow_remote_endpoints: true (location is inferred from the
  # endpoint host; declare it to override, e.g. for a tailnet box).
  # cloud-burst:
  #   id: anthropic/claude-sonnet-4.5
  #   endpoint: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_KEY}      # the declared key always wins over the
  #   capabilities: [text, vision, tools, json]      # client's own bearer
  #   context_window: 200000

# The embedding model powering role classification is infrastructure, not a
# routing target (FR-4). Delete this block and classification degrades to
# default_role + capability filtering — the router will say so at startup.
embedding:
  id: nomic-embed-text
  endpoint: http://127.0.0.1:8082/v1

# --------------------------------------------------------------------- roles
# A role names a class of work; its cascade is the ordered list of models
# serving it. Position 0 is the role's main model; positions 1..n are the
# escalation path (FR-7). Any role may have a cascade of length one.
roles:
  chat:
    cascade: [qwen-fast, main-model]
  code:
    cascade: [main-model]
    # utterances:                 # override the shipped classification examples
    #   - "write a function that ..."
  vision:
    cascade: [main-model]         # a multimodal main needs no separate vision model
    requires: [vision]            # hard capability requirement, validated at startup
    # locality: local             # fence: this role's sessions never reach a
    #                             # remote model, not even via failover
    # buffered: true              # hold tool-call responses for validation (FR-8)

routing:
  default_role: chat

# ------------------------------------------------------------------- ranking
# `hello-operator --rank-free [--apply]` rediscovers each hosted provider's free
# models, probes them, and rewrites the free half of every non-vision cascade.
# ranking:
#   provider_order: [https://openrouter.ai/api/v1]
#   min_context: 262144
#   jev:                          # TypeSafe JEV judges each catalogue entry:
#     api_key: ${JEVER_API_KEY}   #   is it free? does it meet the requirement?
#     threshold: 0.5              # without a key, fixed rules judge instead
#     requirement: >-
#       The model accepts text input, alone or with other media, and produces
#       text output, alone or with other media.

# ---------------------------------------------------------------- key pools
# Several accounts for one provider: calls rotate across the keys, and a key the
# provider refuses (401/402/403/429) is set aside while the same model is retried
# on the next one. Name environment variables only; keep the values in the
# service's environment, never in this file.
# router:
#   key_pools:
#     https://openrouter.ai/api/v1: [${OPENROUTER_API_KEY}, ${OPENROUTER_API_KEY_2}]
